name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # Release 目录已包含 exe/data/dll Runner 全套, 直接打包上传
      - name: Zip build output
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:RUNNER_TEMP/proxypin-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-windows
          path: ${{ env.RUNNER_TEMP }}/proxypin-windows.zip
          if-no-files-found: error
